<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"></stop>
      <stop offset="100%" stop-color="#1E293B"></stop>
    </linearGradient>

    <linearGradient id="bookLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"></stop>
      <stop offset="100%" stop-color="#4F46E5"></stop>
    </linearGradient>

    <linearGradient id="bookRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"></stop>
      <stop offset="100%" stop-color="#6366F1"></stop>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"></stop>
      <stop offset="100%" stop-color="#F59E0B"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"></rect>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"></circle>

  <!-- Glow -->
  <circle cx="256" cy="230" r="110" fill="#7C3AED" opacity="0.15" filter="url(#glow)"></circle>

  <!-- Open Book -->
  <path d="
    M130 170
    C170 145 220 145 256 175
    L256 340
    C220 310 170 310 130 340
    Z" fill="url(#bookLeft)"></path>

  <path d="
    M256 175
    C292 145 342 145 382 170
    L382 340
    C342 310 292 310 256 340
    Z" fill="url(#bookRight)"></path>

  <!-- Spine -->
  <line x1="256" y1="175" x2="256" y2="340" stroke="#E5E7EB" stroke-width="4"></line>

  <!-- Decorative page lines -->
  <path d="M160 210 Q205 190 240 210" stroke="white" opacity="0.3" fill="none" stroke-width="2"></path>

  <path d="M272 210 Q307 190 352 210" stroke="white" opacity="0.3" fill="none" stroke-width="2"></path>

  <!-- Magic Crystal -->
  <path d="
    M256 105
    L285 145
    L256 185
    L227 145
    Z" fill="url(#gold)" filter="url(#glow)"></path>

  <!-- Magic Rays -->
  <line x1="256" y1="65" x2="256" y2="90" stroke="#FCD34D" stroke-width="4"></line>

  <line x1="205" y1="95" x2="220" y2="110" stroke="#FCD34D" stroke-width="4"></line>

  <line x1="307" y1="95" x2="292" y2="110" stroke="#FCD34D" stroke-width="4"></line>

  <!-- Floating Particles -->
  <circle cx="170" cy="125" r="5" fill="#FCD34D"></circle>
  <circle cx="340" cy="135" r="4" fill="#FCD34D"></circle>
  <circle cx="145" cy="220" r="3" fill="#FFFFFF"></circle>
  <circle cx="370" cy="240" r="3" fill="#FFFFFF"></circle>
  <circle cx="190" cy="95" r="3" fill="#FFFFFF"></circle>
  <circle cx="325" cy="100" r="3" fill="#FFFFFF"></circle>

  <!-- Bookmark -->
  <path d="
    M244 175
    L268 175
    L268 225
    L256 212
    L244 225
    Z" fill="url(#gold)"></path>

</svg>